<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:;">
  <title>Camera</title>
  <style>
    html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    .wrap{position:relative;width:100%;height:100%;border-radius:12px;overflow:hidden;background:#111;border:1px solid rgba(255,255,255,.3);box-shadow:0 12px 34px rgba(0,0,0,.45);cursor:grab;touch-action:none;user-select:none}
    .wrap.dragging{cursor:grabbing;border-color:rgba(255,255,255,.7)}
    #frame{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1);-webkit-user-drag:none}
    .off{position:absolute;inset:0;display:grid;place-items:center;background:#181a1d;color:#cbd5e1;font:800 11px/1.3 ui-monospace,monospace;letter-spacing:.4px;text-align:center;padding:6px}
    .off[hidden]{display:none}
    .label{position:absolute;left:5px;top:4px;font:700 9px/1.2 ui-monospace,monospace;color:#fff;background:rgba(0,0,0,.6);padding:2px 5px;border-radius:5px;letter-spacing:.4px;pointer-events:none}
    .size{position:absolute;right:4px;bottom:4px;width:18px;height:18px;display:grid;place-items:center;border:0;border-radius:5px;background:rgba(0,0,0,.6);color:#fff;font:800 9px/1 ui-monospace,monospace;cursor:pointer;padding:0}
    .size:hover{background:rgba(0,0,0,.9)}
    .hint{position:absolute;left:5px;bottom:4px;font:700 8.5px/1.2 ui-monospace,monospace;color:#fff;background:rgba(0,0,0,.6);padding:2px 5px;border-radius:5px;pointer-events:none;opacity:0;transition:opacity .15s}
    .wrap:hover .hint{opacity:1}
  </style>
</head>
<body>
  <div class="wrap" id="wrap" title="Camera bubble — drag to place it anywhere, S/M/L to resize">
    <img id="frame" alt="">
    <div class="off" id="off" hidden>Camera off</div>
    <span class="label">Camera</span>
    <span class="hint" id="hint">drag to move</span>
    <button class="size" id="size" title="Camera size (S / M / L)">M</button>
  </div>
  <script type="module" src="cam-overlay.js"></script>
</body>
</html>
