<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Screenshot</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;background:#000;cursor:crosshair;user-select:none;-webkit-user-select:none}
    #shotImg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
    #dim{position:absolute;inset:0;background:rgba(0,0,0,.45);pointer-events:none}
    #sel{
      position:absolute;display:none;pointer-events:none;
      box-shadow:0 0 0 9999px rgba(0,0,0,.45),0 0 0 1px #0084ff,0 0 0 2px rgba(255,255,255,.6);
      background:rgba(0,132,255,.08)
    }
    #sel.on{display:block}
    #hint{
      position:fixed;left:50%;bottom:36px;transform:translateX(-50%);
      background:rgba(15,16,18,.92);color:#e4e6eb;padding:10px 18px;border-radius:12px;
      font:600 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      letter-spacing:.2px;box-shadow:0 8px 32px rgba(0,0,0,.45);z-index:5;
      border:1px solid rgba(255,255,255,.08);pointer-events:none
    }
    #dims{
      position:fixed;right:24px;bottom:36px;background:rgba(15,16,18,.92);color:#b0b3b8;
      padding:8px 12px;border-radius:10px;font:600 12px/1.2 ui-monospace,monospace;
      border:1px solid rgba(255,255,255,.08);z-index:5;pointer-events:none;min-width:72px;text-align:center
    }
    #bar{
      position:fixed;left:50%;top:24px;transform:translateX(-50%);display:flex;gap:8px;z-index:5
    }
    #bar button{
      border:0;border-radius:10px;padding:9px 16px;font:600 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.4)
    }
    #btnCancel{background:rgba(40,42,46,.95);color:#e4e6eb}
    #btnCancel:hover{background:#3a3b3c}
    #btnFull{background:#0084ff;color:#fff}
    #btnFull:hover{background:#0073e6}
  </style>
</head>
<body>
  <img id="shotImg" alt="">
  <div id="dim"></div>
  <div id="sel"></div>
  <div id="bar">
    <button id="btnCancel" type="button">Cancel (Esc)</button>
    <button id="btnFull" type="button">Capture full screen</button>
  </div>
  <div id="hint">Drag to select a region · Esc to cancel</div>
  <div id="dims">—</div>
  <script src="shot-overlay.js"></script>
</body>
</html>
